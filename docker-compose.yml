name: access-mgmt

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accessmgmt
      POSTGRES_USER: accessmgmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessmgmt -d accessmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Alembic migrations (one-shot) ───────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://accessmgmt:${POSTGRES_PASSWORD:-changeme}@db:5432/accessmgmt
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── FastAPI ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      uvicorn role_recommender.api.main:app
      --reload --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://accessmgmt:${POSTGRES_PASSWORD:-changeme}@db:5432/accessmgmt
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      APP_ROOT: /app
    volumes:
      - ./src:/app/src   # hot-reload only; models/data are baked into the image
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ── Streamlit dashboard ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      APP_ROOT: /app
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src   # hot-reload only; models/data are baked into the image
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
