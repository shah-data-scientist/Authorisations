name: access-mgmt

services:

  # ── Redis (fleet analytics cache) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── FastAPI ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      uvicorn role_recommender.api.main:app
      --reload --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      APP_ROOT: /app
    volumes:
      - ./src:/app/src          # hot-reload; models/data are baked into the image
      - audit_db:/app/audit     # persist SQLite audit trail across restarts
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ── Streamlit dashboard ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      APP_ROOT: /app
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src          # hot-reload; models/data are baked into the image
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  audit_db:
