worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Streamlit needs long-lived WebSocket connections
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;

    upstream api_upstream {
        server api:8000;
    }

    upstream dashboard_upstream {
        server dashboard:8501;
    }

    server {
        listen 80;
        server_name _;

        # ── FastAPI — strip /api prefix before forwarding ──────────────────
        location /api/ {
            proxy_pass         http://api_upstream/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Streamlit WebSocket (/_stcore/stream) ─────────────────────────
        location /_stcore/stream {
            proxy_pass         http://dashboard_upstream/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ── Streamlit — everything else ────────────────────────────────────
        location / {
            proxy_pass         http://dashboard_upstream/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
