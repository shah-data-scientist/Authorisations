[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "role-recommender"
version = "0.1.0"
description = "Hybrid role mining + ABAC drift detection on UCI Amazon Access Samples"
requires-python = ">=3.11"
dependencies = [
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "ucimlrepo>=0.0.7",          # fetch UCI datasets programmatically

    # role mining
    "joblib>=1.4",

    # retained for detector.py / explainer.py (not used in current pipeline)
    "shap>=0.45",
    "xgboost>=2.0",

    # api
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "gunicorn>=22.0",
    "httpx>=0.27",              # dashboard → API calls + test client

    # database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",    # alembic migrations (sync driver)

    # cache
    "redis>=5.0",

    # dashboard
    "streamlit>=1.35",
    "plotly>=5.22",
    "altair>=5.3",

    # utilities
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "black>=24.4",
    "flake8>=7.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
